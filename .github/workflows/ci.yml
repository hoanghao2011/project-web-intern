name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client

  client-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initiate MongoDB replica set
        run: |
          docker exec $(docker ps -q --filter "ancestor=mongo:7") \
            mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          sleep 5

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Seed database
        run: npm run seed
        working-directory: server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/equipment_management_ci?replicaSet=rs0
          JWT_SECRET: ci_test_secret
          JWT_EXPIRES_IN: 1h

      - name: Start server
        run: npm start &
        working-directory: server
        env:
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/equipment_management_ci?replicaSet=rs0
          JWT_SECRET: ci_test_secret
          JWT_EXPIRES_IN: 1h
          CLIENT_URL: http://localhost:5174

      - name: Wait for server health check
        run: npx wait-on http://localhost:5001/api/health --timeout 30000

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: client
        env:
          VITE_API_URL: http://localhost:5001/api
